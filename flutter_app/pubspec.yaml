name: mtm
description: MTM — نظام إدارة فرق الإسعاف التطوعي (Flutter, offline-first, Arabic RTL, mock data).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3
  # QR display for MFA setup (no camera, no scanning).
  qr_flutter: ^4.1.0
  # Opening a support address in the user's own mail or Telegram app
  # (`/more/about`). The official Flutter-team plugin, used through the single
  # `ExternalLinkLauncher` seam in `core/platform/` — no widget calls it
  # directly, and nothing else in the app launches a URL.
  url_launcher: ^6.3.2
  # Durable local key/value storage — the ONE persistence mechanism in this
  # app, reached only through `core/storage/local_store.dart`. Added for the
  # development demo-persona record (`DemoSessionStore`), which has to survive
  # a real process restart; the theme, motion-level and forced-upgrade seams
  # are written against the same `LocalStore` and can be moved onto it without
  # a second storage architecture. Official Flutter-team plugin, same class as
  # `url_launcher` above, and used through a single seam for the same reason.
  shared_preferences: ^2.5.3
  # Provider identity only. The ID token is exchanged immediately with the
  # MTM backend and is never persisted or decoded for authorization locally.
  google_sign_in: ^7.2.0
  # Security-sensitive auth/session material uses the platform keystore /
  # keychain. It must never share the ordinary preferences store above.
  flutter_secure_storage: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Brand artwork. ONE mark: `leader_logo_clean_layer.png` — `06 · Clean
  # Layer` — drawn by `core/brand/brand_mark.dart` and the artwork the Android
  # launcher icon is generated from (`android/app/src/main/res/mipmap-*`), so
  # the icon on the home screen and the mark inside the app are the same
  # object. It is not a preference; the two alternates that were briefly
  # selectable in Settings are gone. The legacy `mtm_logo_full.png` stays
  # bundled but is no longer drawn.
  assets:
    - assets/brand/

  # Bundled font — do NOT swap for google_fonts. This app is offline-first,
  # google_fonts fetches at runtime and the first launch without network
  # renders in a fallback face which shifts the whole design.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
